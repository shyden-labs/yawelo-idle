# SonarCloud settings for the scan in .github/workflows/sonarcloud.yml (#655).
# The organisation and project key are passed by ci.yml.
#
# Tests live beside the code they test (packages/*/test, packages/*/properties,
# apps/site/test) as well as under tests/, so tests are picked out by pattern:
# a file is either source or test, never both.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.js,tests/**,**/test/**,**/properties/**
# docker/node/Dockerfile is only Node's version pin for Dependabot and the
# workflows' setup-node (#793, #942): no image is ever built or run from it,
# so docker:S6471 ("runs as root") cannot apply. It sat unscanned under
# .github/ until #942 moved it.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.build/**,coverage/**,**/*.test.ts,**/*.test.js,tests/**,**/test/**,**/properties/**,**/worker-configuration.d.ts,docker/node/Dockerfile

# One report per suite the coverage job measures (scripts/coverage.ts), then
# one per Worker config the Worker suites serve (scripts/worker-coverage-report.ts,
# #1093), read side by side and never joined (#733).
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/guards/lcov.info,coverage/properties/lcov.info,coverage/integration/lcov.info,coverage/pacing/lcov.info,coverage/worker-apps__door__wrangler/lcov.info,coverage/worker-apps__site__wrangler/lcov.info,coverage/worker-apps__site__wrangler.roadmap-test/lcov.info,coverage/worker-apps__sync-worker__wrangler/lcov.info,coverage/worker-apps__sync-worker__wrangler.injected/lcov.info,coverage/worker-apps__web__wrangler/lcov.info

# No coverage tool can instrument SQL, and SonarCloud only imports coverage
# reports, so the D1 migrations count as uncovered lines on new code (#162).
# apps/sync-worker/test/schema.test.ts runs them against a real local D1.
# Excluded from coverage only (Shyden, 2026-11-16): still analysed for issues.
sonar.coverage.exclusions=apps/sync-worker/migrations/**/*.sql

# githubactions:S6505 asks every `npm ci` for --ignore-scripts. Dependency
# install scripts are already denied by package.json's allowScripts (#788,
# tested in tests/unit/supply-chain.test.ts), and npm enforces that: measured
# 2026-11-17 on Node 26.13.0 (CI's version), esbuild's postinstall ran without
# the denial and did not run with it (#1006). The scripts left are this repo's
# own (postinstall types, prepare hooks path), which the jobs need.
sonar.issue.ignore.multicriteria.installscripts.ruleKey=githubactions:S6505
sonar.issue.ignore.multicriteria.installscripts.resourceKey=.github/workflows/**

# typescript:S4036 asks the helper scripts to run gh, git and npm by full path
# rather than through PATH. They run only on the operator's laptop and in CI,
# and anyone able to plant a fake `gh` in a PATH folder there can already
# change the scripts themselves, so the rule is marked accepted (Shyden,
# 2026-11-17, #1007).
sonar.issue.ignore.multicriteria.pathcommands.ruleKey=typescript:S4036
sonar.issue.ignore.multicriteria.pathcommands.resourceKey=scripts/**
# typescript:S2699 reads a test with no expect() as asserting nothing. The
# property tests under packages/core/properties/ assert through fast-check's
# fc.assert(fc.property(...)), which throws, failing the test, on the first
# counterexample; Sonar does not know fc.assert as an assertion. All 16 sites
# were read on 2026-11-18 and each holds an fc.assert (#1010). The folder's
# one other file, golden-vectors.test.ts, uses expect() and was not flagged.
sonar.issue.ignore.multicriteria.propertytests.ruleKey=typescript:S2699
sonar.issue.ignore.multicriteria.propertytests.resourceKey=packages/core/properties/**/*.test.ts
# Per-file markers (#1010, 2026-11-18): each names the exact file SonarCloud
# flagged and that was read, never a rule repo-wide, so a new finding of the
# same rule elsewhere still shows. The reason follows each rule.
# javascript:S7785: a classic script (loaded with defer, not as a module) cannot use top-level await.
sonar.issue.ignore.multicriteria.f1.ruleKey=javascript:S7785
sonar.issue.ignore.multicriteria.f1.resourceKey=apps/site/holding/public/holding-video.js
