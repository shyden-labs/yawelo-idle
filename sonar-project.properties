# SonarCloud settings for the scan in .github/workflows/sonarcloud.yml (#655).
# The organisation and project key are passed by ci.yml.
#
# Tests live beside the code they test (packages/*/test, packages/*/properties,
# apps/site/test) as well as under tests/, so tests are picked out by pattern:
# a file is either source or test, never both.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*.test.ts,**/*.test.js,tests/**,**/test/**,**/properties/**
sonar.exclusions=**/node_modules/**,**/dist/**,**/.build/**,coverage/**,**/*.test.ts,**/*.test.js,tests/**,**/test/**,**/properties/**,**/worker-configuration.d.ts

# One report per suite the coverage job measures (scripts/coverage.ts).
sonar.javascript.lcov.reportPaths=coverage/unit/lcov.info,coverage/guards/lcov.info,coverage/properties/lcov.info,coverage/integration/lcov.info,coverage/pacing/lcov.info
