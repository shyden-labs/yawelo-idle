name: Story
description: One story, fully defined before any work starts.
labels: []
body:
  - type: markdown
    id: estimate-note
    attributes:
      value: |
        After filing, add the issue to the "Yawelo Idle Stories" board and set its **Estimate** field: 1, 2, 3, 5, 8 or 13 story points. Anything larger is an epic: split it into stories.
        Score from the acceptance criteria against similar closed stories, never from felt hours. Progress by effort reads the board field and nothing else.
        Set its **Priority** too: P0 (now) to P5 (someday), as the board’s option descriptions define them. A blocker takes at least the level of what waits on it. The next ticket comes from `node scripts/board-next.ts`, never from the handover.
        Set each issue this one waits on as a **Blocked by** link on the issue, and its epic as its parent (sub-issue). A `## Depends on` section is context, not the record.
  - type: textarea
    id: story
    attributes:
      label: Story
      description: As a <who>, I can <what>, so that <why>.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: The spec sections, decisions and research it rests on, and what it depends on.
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance criteria
      description: Numbered, each one testable. A story is not ready until these are complete.
      value: |
        1.
    validations:
      required: true
  - type: textarea
    id: website
    attributes:
      label: Website
      description: >-
        What this lets the coming-soon site show once it closes, which becomes a
        "Website: announce <feature>" story (CLAUDE.md, "Website follows the game").
        Write "nothing player-facing" and say why if there is nothing to show.
    validations:
      required: true
  - type: textarea
    id: definition-of-done
    attributes:
      label: Definition of done
      value: |
        - Every new test written first and seen red for the stated reason.
        - Every new guard seen failing once when written.
        - Lint, typecheck, formatting and the zero-warnings gate pass; no retries; one test per case.
        - CI green on the PR head SHA, read step by step by name; merged into `develop` and deployed to dev, verified.
