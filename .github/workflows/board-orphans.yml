# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment, as in ci.yml (tests/unit/supply-chain.test.ts).
#
# The orphan check (#580): a ticket is In Progress on the board only while a
# branch or an open pull request names it (operator 2026-10-13, every
# project). Branch protection requires this job by its name, so a pull
# request cannot merge while an orphan sits on the board or while the board
# cannot be read. Edits re-run it, since a pull request's title and body name
# tickets too.
#
# The board is read with the read-only roadmap App (#341) through the
# `board-read` environment, which admits pull-request runs and holds only
# that App's key; the branches and pull requests are public and are read with
# the run's own token (operator 2026-10-15). A fork's pull request gets no
# secrets at all. Every step runs for every author (#661: a check is green
# only when it ran): Dependabot's runs get no environment secrets, so theirs
# read ROADMAP_APP_KEY from the repository's Dependabot secret. It needs no
# install: the script imports only Node's own modules and the repo's
# TypeScript.
name: board-orphans
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read

jobs:
  board-orphans:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: board-read
    steps:
      - name: The board key is set
        env:
          KEY: ${{ secrets.ROADMAP_APP_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::error::ROADMAP_APP_KEY is not set, so the board cannot be read: it is the board-read environment's secret, and the repository's Dependabot secret for Dependabot's pull requests (#580, #661)."
            exit 1
          fi
      - name: Mint the board token (read-only roadmap App)
        id: board-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liVLjRN8twjcTmN0
          private-key: ${{ secrets.ROADMAP_APP_KEY }}
          owner: shyden-labs
          permission-issues: read
          permission-organization-projects: read
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: No ticket is In Progress without a branch or open pull request
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BOARD_TOKEN: ${{ steps.board-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/board-orphans.ts PVT_kwDOEOcG584BlRWb "Yawelo Idle Stories" "$GITHUB_REPOSITORY"
