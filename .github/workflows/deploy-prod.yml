# Releases main to production (#621). A release is a pull request from develop
# into main that Shyden merges (operator, 2026-10-16: "Merge develop into
# main"). The push runs the whole build-and-test suite on that commit, then
# the deploy job waits for Shyden's approval in the `production` environment,
# which admits main alone. It deploys the holding page as the assets-only
# Worker yawelo-idle-site in the production account, tagged with the commit
# so rollback-prod.yml can return to it, and verifies it from outside.
#
# Every Cloudflare secret here is a `production` ENVIRONMENT secret, never a
# repository secret, and no dev workflow names that environment
# (tests/unit/workflow-secrets.test.ts, tests/unit/prod-workflows.test.ts).
name: deploy-prod
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A deploy and a rollback never overlap, and neither is cancelled.
concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # The push is always a full run: the docs-only path never applies
  # (tests/unit/ci-fast-path.test.ts). A reusable-workflow call may not set
  # timeout-minutes; ci.yml's own job carries it.
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    # A dispatch from any other branch stops here; the environment admits
    # main alone as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: production
      url: https://yawelo-idle.shyden.co.uk
    # The token is given only to the steps that call Cloudflare, so npm ci's
    # install scripts and the build never hold it.
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # The production token must reach the production account (the one that
      # holds the shyden.co.uk zone) and nothing else.
      - name: Prove the production token reaches the production account alone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/token-reach.ts
      - name: Build the holding page, stamped with this commit
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build:holding --workspace @yawelo-idle/site
      # Named from the repository root: from a subfolder of a workspace, npx
      # runs wrangler at the workspace's root, which reads the dev site's
      # apps/site/wrangler.jsonc instead (deploy-dev run 38889757344).
      - name: Deploy the holding page, tagged with this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config apps/site/holding/wrangler.jsonc --tag "$GITHUB_SHA" --message "release $GITHUB_SHA"

  verify:
    needs: deploy
    runs-on: ubuntu-24.04
    # verify-prod waits at most 60 looks, 10 s apart, for a new Custom
    # Domain's DNS and certificate, then judges every check once.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # The verify compares production with what this commit builds.
      - name: Build the holding page this commit released
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build:holding --workspace @yawelo-idle/site
      - name: Verify production serves this commit, its headers, 404 pages and the video
        env:
          PROD_URL: https://yawelo-idle.shyden.co.uk
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-prod.ts
