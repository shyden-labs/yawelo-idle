# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment, as in ci.yml (tests/unit/supply-chain.test.ts).
#
# The daily owner-review check (#687): develop must still ask Shyden to
# review the twin list (#374, "GitHub asks you"). Each day it reads develop's
# "Require review from Code Owners" and the rules in .github/CODEOWNERS on
# develop, and opens one issue assigned to ShydenMcM when either is wrong, or
# when either cannot be read (fail closed). An issue already open is
# commented on rather than opened again.
#
# Branch protection cannot be read with the run's own token. It is read with
# the read-only roadmap App, widened to Administration: read (Shyden,
# 2026-10-20, asked twice), whose key the `dev` environment already holds for
# the site Worker. `dev` admits develop alone, which is where a schedule runs,
# and is the one environment a scheduled job may name
# (tests/unit/scheduled-workflows.ts). The issue is written with the run's
# own token, so the App's key stays read-only.
#
# Checkout and node come first so that a failed mint still reaches the check,
# which reports the missing token in the issue; the job stays red either way.
name: owner-review
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  owner-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
      - name: Mint the settings token (read-only roadmap App)
        id: admin-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: Iv23liVLjRN8twjcTmN0
          private-key: ${{ secrets.ROADMAP_APP_KEY }}
          owner: shyden-labs
          repositories: yawelo-idle
          permission-administration: read
      - name: Develop still asks Shyden to review the twin list
        if: ${{ !cancelled() }}
        env:
          ADMIN_TOKEN: ${{ steps.admin-token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
        run: node scripts/owner-review.ts "$GITHUB_REPOSITORY"
