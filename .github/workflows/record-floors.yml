# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment, as in ci.yml (tests/unit/supply-chain.test.ts).
#
# Records the guards' floors in CI (#547; global rule 2026-10-09: "Floors
# are recorded by a separate CI job") on a commit not yet pushed to its
# branch (#718; global rule 2026-10-21: "a CI bot never pushes to a branch").
# The session pushes the commit to the scratch ref `refs/floors/<branch>`,
# which starts no run, and dispatches this workflow on develop with the
# branch and the SHA: `workflow_dispatch` refuses a scratch ref, and a
# dispatch on develop checks out a scratch-only SHA exactly (#718 AC1, run
# 39521577298). This runs every suite at that SHA with the recorder's switch
# set and uploads `tests/floors/` as `floors-<sha>`. `npm run floors:fetch
# <run-id>` writes them into the unpushed commit, the branch is pushed once,
# and the scratch ref is deleted. The workflow file is develop's copy; the
# scripts it runs are the measured commit's. Nothing here can write to the
# repository.
name: record-floors
run-name: record-floors ${{ inputs.branch }} at ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The ticket branch whose scratch ref holds the commit
        required: true
        type: string
      sha:
        description: The full SHA at refs/floors/<branch>
        required: true
        type: string

permissions:
  contents: read

jobs:
  # The scratch-ref gate and the rehearsal (#771), on the runner host, where
  # #762's act runs will find Docker. The gate runs first, from this
  # workflow's own ref (develop), so the commit it judges never runs its own
  # gate (scripts/record-gate.ts: develop and main, a malformed branch or SHA,
  # and a SHA that is not the scratch ref's tip are refused). The commit is
  # checked out only after it passes, and the other jobs need this one, so
  # nothing checks it out sooner. The second checkout keeps no credential
  # (actions/checkout's configureAuth removes the first's; the rehearsal
  # refuses one it finds). No install: both scripts import node built-ins
  # only. Each script starts from one inline line, counted as an untested
  # workflow line in the coverage record (Shyden, 2026-10-28: "Start line in
  # the workflow"): a start file would be either an untested new file or a
  # call at collection. The upload and the coverage job's download are found by the
  # artifact's name, rehearsal-<sha>.
  rehearse:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Refuse anything but the tip of a ticket branch's scratch ref
        run: node --input-type=module -e "const { gate, nodeIo } = await import('./scripts/record-gate.ts'); process.exitCode = gate(nodeIo);"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      - name: Rehearse the workflows
        run: node --input-type=module -e "const { rehearse, nodeRehearseIo } = await import('./scripts/rehearse.ts'); process.exitCode = await rehearse(nodeRehearseIo);"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rehearsal-${{ inputs.sha }}
          path: rehearsal/
          if-no-files-found: error

  record-floors:
    # The gate passed this commit first (rehearse, above).
    needs: rehearse
    runs-on: ubuntu-24.04
    # The recorder runs every suite with a floor, the browser suites included,
    # each of which ci.yml holds to its own limit; 30 covers them in one job.
    timeout-minutes: 30
    # ci.yml's image, digest and user: the browser suites need its browsers.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          # The commit and its parent, as ci.yml has them.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install (a warning fails it)
        run: scripts/fail-on-warnings.sh npm ci
      - name: Record the floors
        env:
          FLOORS_RECORD_JOB: record-floors
        run: npm run floors:record
      - name: Upload the recorded floors
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: floors-${{ inputs.sha }}
          path: tests/floors/
          if-no-files-found: error

  # The coverage record (#728, Shyden 2026-10-22: "Must be recorded"), in its
  # own job (#748): a fresh checkout and install of the same commit, with the
  # floors the first job recorded laid over tests/floors/, so it measures the
  # tree the pull request will hold, as ci.yml's coverage job measures it, in
  # that job's image and limits. Measured in the first job it either ran on
  # the old floors, and the guards suite failed on every branch whose floors
  # moved, or after the floors recorder had run every suite, which moved one
  # file's total (#745). It needs the first job, so the scratch-ref refusal
  # gates it too, and it checks out the same SHA. Measure runs without the
  # record switch; only the record step sets it, and the recorder refuses
  # anywhere else.
  record-coverage:
    needs: record-floors
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install (a warning fails it)
        run: scripts/fail-on-warnings.sh npm ci
      # The rehearse job's manifest, which Measure judges (#771).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: rehearsal-${{ inputs.sha }}
          path: rehearsal/
      - name: Lay the recorded floors over the tree
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: floors-${{ inputs.sha }}
          path: tests/floors/
      # ci.yml's measured limit for the same command (#476).
      - name: Measure coverage
        timeout-minutes: 12
        run: npm run test:coverage -- rehearsal/
      - name: Record coverage
        env:
          FLOORS_RECORD_JOB: record-floors
        run: node scripts/coverage.ts record
      # Its own artifact, so the floors artifact keeps its layout.
      - name: Upload the coverage record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-${{ inputs.sha }}
          path: tests/coverage/record.json
          if-no-files-found: error
