# Deploys each frozen release/* cut to TEST (#784 AC2, AC5; Shyden,
# 2026-11-17), before the same cut goes to production through main. TEST holds
# exactly what production deploys, which is the holding page alone today, as
# its locked-down copy (crawlers blocked, noindex) in the non-PROD account at
# its own workers.dev address; it grows as production grows.
#
# Its Cloudflare key is a `test` ENVIRONMENT secret, limited to TEST's own
# Workers (Shyden, 2026-11-17), so it can reach nothing of DEV's or PROD's
# (spec §12.9, tests/unit/workflow-secrets.test.ts). The account id is the
# non-PROD account's, the same account DEV deploys into.
#
# One deploy runs at a time and none is cancelled.
name: deploy-test

on:
  push:
    branches: ['release/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-test
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    environment:
      name: test
      url: https://yawelo-idle-holding-test.yawelo-idle-non-prod.workers.dev/
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: npm ci
      - name: Prove TEST's key reaches the non-PROD account alone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/token-reach.ts
      - name: Build the holding page, stamped with this commit
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build:holding --workspace @yawelo-idle/site
      - name: Make its locked-down copy (crawlers blocked, noindex)
        run: node scripts/holding-dev.ts
      - name: Deploy TEST's holding page, tagged with this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.TEST_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no wrangler deploy --config apps/site/holding-test/wrangler.jsonc --tag "$GITHUB_SHA" --message "release cut $GITHUB_SHA"

  verify:
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - run: npm ci
      - name: Build the holding page this commit deployed
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build:holding --workspace @yawelo-idle/site
      - name: Make its locked-down copy (crawlers blocked, noindex)
        run: node scripts/holding-dev.ts
      - name: Verify TEST serves this commit, noindex, crawlers blocked
        env:
          DEV_HOLDING_URL: https://yawelo-idle-holding-test.yawelo-idle-non-prod.workers.dev
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-prod.ts --dev-copy
