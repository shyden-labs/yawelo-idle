# Dev never falls behind develop silently (#497): once a day, compare
# develop's head with the commit dev's sync API reports at /health. When dev
# serves another commit and the head is over 30 minutes old, or dev cannot be
# read, scripts/dev-behind-develop.ts opens an issue assigned to ShydenMcM (or
# comments on the open one) and the run goes red. Recover by dispatching
# deploy-dev on develop.
#
# /health needs no password, so this job holds no stored secret and names no
# environment; the run's own token reads the runs and writes the issue.
# A dispatch may stand in an older served commit: the planted failure that
# proves the issue path on GitHub itself (#497 AC2).
name: dev-behind-develop
on:
  schedule:
    - cron: '17 1 * * *'
  workflow_dispatch:
    inputs:
      stand_in_served:
        description: 'Planted failure (#497 AC2): report this commit as the one dev serves'
        required: false
        default: ''

permissions:
  actions: read
  contents: read
  issues: write

jobs:
  check:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (.github/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Compare develop's head with the commit dev serves
        env:
          DEV_SYNC_URL: https://dev-api.yawelo-idle.shyden.co.uk
          GITHUB_TOKEN: ${{ github.token }}
          STAND_IN_SERVED: ${{ inputs.stand_in_served }}
        run: node scripts/dev-behind-develop.ts
