# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment. A tag is mutable and can be repointed by anyone who can
# push to that action's repo; the SHA is the only immutable reference. The
# comment is what makes a Dependabot bump reviewable by a human rather than an
# opaque hex swap -- so never remove it, and never let it drift from the SHA.
#
# Runs on every PR (the required `build-and-test` check) and is called by
# deploy-dev.yml before each dev deploy, so develop never deploys a tree that
# has not passed here.
#
# A docs-only change (HANDOVER.md and Markdown under docs/, #360) runs
# checkout, install, Format and the unit suite; `classify` decides, and every
# other step skips only on its `docs-only` verdict, so the required check
# still reports and anything else runs in full. deploy-dev's call is a push,
# which is always full (tests/unit/ci-fast-path.test.ts).
name: build-and-test
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-26.04
    # GitHub's default is 360 minutes (#44). Each test suite but the unit
    # suite holds its own step to one measured limit (#476), so the job allows
    # 20 for those and the rest.
    timeout-minutes: 20
    # The browsers and their system libraries come baked into Playwright's own
    # image, so no step downloads from an apt mirror. `--with-deps` did, and a
    # starved mirror held four runs for up to 35 minutes on 2026-10-01 (#44).
    # The tag must be the @playwright/test version the lockfile installs, and
    # the digest pins it (both enforced by tests/unit/supply-chain.test.ts).
    # It runs as uid 1001, the runner's own user, as probed in run 36923761040.
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      # GitHub raises Dependabot security fixes against the default branch
      # only, and reads dependabot.yml and the issue forms from it, so it must
      # be develop (#460). First, and outside the docs-only skips, so a wrong
      # default fails every run in seconds.
      - name: The default branch is develop
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$DEFAULT_BRANCH" != "develop" ]; then
            echo "::error::The default branch is '$DEFAULT_BRANCH', not develop, so Dependabot security fixes and its config live outside the develop gate (#460). Set it in Settings > General > Default branch."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The commit and its parents: classify diffs HEAD^1..HEAD.
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # Dates and language names come from Node's built-in ICU and CLDR, so the
      # run records which ones it used (#942 AC4).
      - name: Print Node's ICU and CLDR versions (#942)
        run: node -p '`icu ${process.versions.icu} cldr ${process.versions.cldr}`'
      - name: Classify the change as docs-only or full (#360)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-scope.ts
      # A pull request into develop merges by squash alone (#679, Shyden
      # 2026-10-18), so fetched floors go in as a normal commit and the commit
      # that lands is the tree this job judged. It reads the rules GitHub
      # applies to develop with the run's own token (they are public), needs
      # no install, and runs on docs-only too: a ruleset can change between
      # any two pull requests.
      - name: Develop merges by squash only (#679)
        timeout-minutes: 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/develop-squash-only.ts "$GITHUB_REPOSITORY"
      - name: Install (a warning fails it)
        run: scripts/fail-on-warnings.sh npm ci
      # Any advisory in the install fails the build unless scripts/npm-audit.ts
      # records it with a reason and an expiry (#720, #873). It runs on
      # docs-only too: an advisory can land on any day.
      - name: Audit (an advisory without a current exception fails it)
        run: node scripts/npm-audit.ts
      - name: Format
        run: npm run format:check
      - name: Lint (zero warnings)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run lint
      - name: Typecheck (tsc, svelte-check)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      # Tests that read or parse the whole repository (#475), docs-only
      # changes included: some read every file. One measured limit.
      - name: Guards (whole-repo checks)
        timeout-minutes: 1
        run: npm run test:guards
      # Tests where a process is the thing tested: shell scripts, the git
      # hook, git on fixture repositories, scripts loading under Node (#490).
      # A unit test starts no process. One measured limit. Since #818 the
      # suite runs the real pre-push hook on four copies of the repository
      # (clean, then a break at each gate). Measured on PR #821's first run,
      # 2026-10-31: the step took 3 min 40 s, the pre-push file 217 s of it;
      # by 2026-11-14 the file took 290 s and the step timed out (#969), so
      # the four copies now run at once. The step's new time is on #969.
      - name: Integration tests
        timeout-minutes: 5
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run test:integration
      # Every fast-check property at its count from before any cut to fit the
      # unit limit, drawing fresh cases on every run (#543). A red property is
      # a real defect, never a re-run. One measured limit (slowest 12 s of
      # its first 3 runs, 2026-10-12).
      - name: Properties (every property at its full count)
        timeout-minutes: 1
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run test:properties
      # The personas play the real core and the spec's pacing targets are
      # checked (#35). AC7 asked for under 5 minutes; its one measured limit
      # is 2 (#476: slowest 40 s of 15 runs, 2026-10-09).
      - name: Pacing bots (under 2 minutes)
        id: pacing
        timeout-minutes: 2
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run test:pacing
      # Only after a pacing run that passed or failed: a step before it that
      # failed skips the suite, and an upload then would fail on a report
      # nothing wrote, a second red step that misleads (#353).
      - name: Upload the pacing report
        if: ${{ !cancelled() && steps.classify.outputs.scope != 'docs-only' && (steps.pacing.outcome == 'success' || steps.pacing.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pacing-report
          path: pacing-report.json
          if-no-files-found: error
      # Each suite below: one measured limit, at least 3 times its slowest
      # run (#476), and none inside it.
      # Measured 36-41 s over the 18 green runs before #784 added the door
      # suite (2026-11-10), so 3 times the slowest is over 2 minutes: 3.
      - name: Worker tests (sync in workerd + local D1, site and game through the asset router, the roadmap in workerd)
        timeout-minutes: 3
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run test:worker
      - name: Build (a warning fails it)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: scripts/fail-on-warnings.sh npm run build
      # No page built for production or either dev copy loads a file from a
      # free shared domain such as r2.dev, which Indonesian providers block
      # (#768). The holding page and its dev copy are built as deploy-dev.yml
      # builds them, then every built file is read.
      - name: Build the holding page
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run build:holding --workspace @yawelo-idle/site
      - name: Make its dev copy
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: node scripts/holding-dev.ts
      - name: No built page loads from a free shared domain
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: node scripts/free-hosts.ts apps/site/dist apps/site/dist-holding apps/site/dist-holding-dev
      # No built page shows an email address or a mailto: link: support
      # requests come only through the support form (#1090).
      - name: No built page shows an email address
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: node scripts/no-email.ts

  # The browser suites, on every desktop browser (#1003): Playwright's image
  # carries Chromium, Firefox and WebKit, and Edge is downloaded first (Shyden,
  # 2026-11-20). Its installer needs root, so this job runs as root, apart
  # from build-and-test, whose integration suite needs the runner's own user
  # (tests/integration/old-name.test.ts). Each suite ends with the shared
  # one-suite check (scripts/browser-suite.sh), which prints every browser's
  # total. Like build-and-test, it reports on a docs-only change without
  # running a suite.
  browsers:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    # Firefox refuses to start as root in a home another user owns (PR
    # #1054): Playwright's own advice is HOME=/root.
    env:
      HOME: /root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      # Root's git refuses a workspace the runner's user checked out ("not in
      # a git directory"), and npm ci's prepare runs git (PR #1054).
      - name: Mark the workspace safe for root's git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Classify the change as docs-only or full (#360)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-scope.ts
      - name: Install (a warning fails it)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: scripts/fail-on-warnings.sh npm ci
      # Edge comes from packages.microsoft.com, 206 MB, and on 2026-11-23 four
      # of 40 runs stalled there at the 3-minute limit (#1092). apt keeps its
      # downloads in a folder the cache holds between runs, so a run downloads
      # only what a newer Edge brings (tests/unit/edge-install-ci.test.ts).
      - name: Keep apt's downloads in the Edge cache folder
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: |
          rm -f /etc/apt/apt.conf.d/docker-clean
          mkdir -p /root/edge-debs/partial
          printf '%s\n' 'Dir::Cache::Archives "/root/edge-debs";' 'Binary::apt::APT::Keep-Downloaded-Packages "true";' > /etc/apt/apt.conf.d/99-edge-cache
      # The run id never matches, so the prefix restores the newest download.
      - name: Restore the Edge download
        id: edge-cache
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/edge-debs
          key: msedge-debs-${{ github.run_id }}
          restore-keys: msedge-debs-
      # Uncached, 40 runs to 2026-11-23 took 19–54 s (#1092), so 3 times the
      # slowest is 162 s (#476). The inner 165 s fires before the step's 3
      # minutes, so a stall names the download it was on.
      - name: Install Edge (Playwright's image lacks it)
        timeout-minutes: 3
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=5 165 npx --no playwright install --with-deps msedge 2>&1 | tee "$RUNNER_TEMP/edge-install.log" || status=$?
          if [ "$status" = 124 ]; then
            echo "::error::Edge install stalled at 165 s; its last download was: $(grep -E '^Get:' "$RUNNER_TEMP/edge-install.log" | tail -n 1)"
          fi
          exit "$status"
      - name: Read the installed Edge version and drop older downloads
        id: edge
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: |
          version=$(dpkg-query -W -f='${Version}' microsoft-edge-stable)
          test -n "$version"
          find /root/edge-debs -name 'microsoft-edge-stable_*.deb' ! -name "microsoft-edge-stable_${version}_*" -delete
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Save the Edge download for later runs
        if: ${{ steps.classify.outputs.scope != 'docs-only' && steps.edge-cache.outputs.cache-matched-key != format('msedge-debs-{0}', steps.edge.outputs.version) }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /root/edge-debs
          key: msedge-debs-${{ steps.edge.outputs.version }}
      # Each suite: one measured limit, at least 3 times its slowest run
      # (#476), and none inside it. On PR #1054 with Edge: engines 27 and 32 s
      # (96 s), web smoke 9 and 11 s (33 s).
      - name: Cross-engine determinism (Node, Chromium, Firefox, WebKit, Edge)
        timeout-minutes: 2
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run test:engines
      - name: Web smoke (the built game in a local Worker, on every desktop browser)
        timeout-minutes: 1
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: npm run test:web

  # Every suite pull-request CI runs, under coverage, one after another, in a
  # job of its own so the unit step above keeps coverage off (#728). It fails
  # below the overall thresholds in scripts/coverage.ts (#795), and is a
  # required check, so like build-and-test it reports on a docs-only change
  # without measuring.
  coverage:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
      options: --user 1001
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - name: Classify the change as docs-only or full (#360)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-scope.ts
      - name: Install (a warning fails it)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: scripts/fail-on-warnings.sh npm ci
      # The Worker suites run inside it too, and judge the Worker code (#1103).
      - name: Measure coverage (every suite pull-request CI runs, the Worker suites included)
        id: measure
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        timeout-minutes: 20
        run: npm run test:coverage
      # Only after a measure that ran: an upload after a skipped one would fail
      # on a report nothing wrote, a second red step that misleads (#353).
      - name: Upload the coverage report
        if: ${{ !cancelled() && (steps.measure.outcome == 'success' || steps.measure.outcome == 'failure') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          if-no-files-found: error
