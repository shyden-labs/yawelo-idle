# Deploys develop to the dev environment on every merge (spec §13): the D1
# database (created on the first deploy, #357, bound by id, #391) and its
# migrations, then the sync Worker, then the game, the holding page's dev copy
# and the site Worker (the password gate in front, spec D9, #39, #332; its
# front door shows the holding page, #673), all in the non-PROD account
# (#784). The front door Worker (apps/door, deployed by deploy-prod.yml with each release, #1152)
# serves them at dev.yaweloidle.com, dev-api.yaweloidle.com and
# dev-holding.yaweloidle.com (#1013). The checks read them back at the
# Workers' own workers.dev addresses, standing in for the door with the door
# secret (#1078): CI never goes through a door (#784 AC1b).
#
# Every Cloudflare secret is a `dev` ENVIRONMENT secret, and `dev` admits only
# the develop branch, so a fork PR or any other branch cannot reach them
# (spec §12.9, enforced by tests/unit/workflow-secrets.test.ts).
name: deploy-dev
on:
  push:
    branches: [develop]
  # Started by hand, it deploys whichever branch it is run on (#961: anything
  # can deploy to dev at any time), and a push event GitHub drops
  # (2026-10-08, #497) is recovered by dispatching it on develop.
  workflow_dispatch:

permissions:
  contents: read

# One deploy runs at a time and is never cancelled. A merge while one runs
# waits as the group's single pending run, and a newer merge replaces it:
# GitHub cancels the older pending run before any job starts (run 42260476673,
# #897). So a merge can go undeployed, but the newest commit always deploys,
# and the daily dev-behind-develop check (#497) catches a stale dev.
concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  # A reusable-workflow call may not set timeout-minutes; ci.yml's own job
  # carries it (tests/unit/workflow-timeouts.test.ts).
  test:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: test
    runs-on: ubuntu-26.04
    # A normal deploy takes 35 s; GitHub's default would be 360 minutes (#44).
    timeout-minutes: 10
    environment:
      name: dev
      url: https://dev.yaweloidle.com
    # When the deploy finished, for verify-roadmap (#708).
    outputs:
      deployed-at: ${{ steps.deployed.outputs.at }}
    # The Cloudflare token is NOT here: it is given only to the steps that call
    # Cloudflare (#395), so npm ci's install scripts and the build never hold it.
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - run: npm ci
      # Before anything uses the token, prove it reaches the dev-only "Shyden
      # Labs Dev" account and nothing else (#395): Cloudflare cannot narrow a
      # Workers or D1 permission below an account, so a token that reached
      # another account could write to production. Any other reach stops here.
      # DEV's Workers and D1 live in the non-PROD account (#784 AC2); its
      # token is the dev environment's NONPROD_ secrets, under the names
      # wrangler reads.
      - name: Prove the non-PROD token reaches the non-PROD account alone
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/token-reach.ts
      # From the repository root, which has no wrangler config to write to.
      # Asia Pacific, near the players (operator, 2026-10-05): a database never
      # moves, and without a hint it lands near the runner, in North America.
      - name: Create the dev D1 database in Asia Pacific if it does not exist yet
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/ensure-d1.ts yawelo-idle-dev apac
      # Bound by name alone, a deploy after the database was recreated reuses
      # the deleted database's id and fails with 7404 (#391). This writes a
      # git-ignored copy of wrangler.jsonc with the id resolved by name, and
      # the migrations and the deploy both read it.
      - name: Bind the sync Worker to the dev D1 database by id
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/d1-binding.ts yawelo-idle-dev apps/sync-worker/wrangler.jsonc apps/sync-worker/wrangler.deploy.jsonc
      - name: Apply D1 migrations (before the Worker, so new code never meets an old schema)
        working-directory: apps/sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no wrangler d1 migrations apply yawelo-idle-dev --remote --config wrangler.deploy.jsonc
      # The sync Worker's secrets reach it from the dev environment's secrets,
      # uploaded with the version itself (#164 AC2): the door secret, so it
      # believes the caller's address the door names, and the key request
      # counts are hashed under.
      - name: Write the sync Worker's secrets file (the dev door secret, the request-count key)
        id: sync-secrets
        env:
          DEV_DOOR_SECRET: ${{ secrets.DEV_DOOR_SECRET }}
          DEV_RATE_KEY: ${{ secrets.DEV_RATE_KEY }}
        run: |
          path="$(node scripts/sync-secrets.ts)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Deploy the sync Worker, stamped with this commit
        working-directory: apps/sync-worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_FILE: ${{ steps.sync-secrets.outputs.path }}
        run: npx --no wrangler deploy --config wrangler.deploy.jsonc --var "COMMIT:${GITHUB_SHA}" --secrets-file "$SECRETS_FILE"
      - name: Build the game, stamped with this commit
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build --workspace @yawelo-idle/web
      # The game first: the site Worker's GAME binding names it (#332). It
      # has no address of its own (`workers_dev: false`), so it holds no
      # password: the site Worker's gate stands in front of it.
      - name: Deploy the game Worker
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no wrangler deploy
      # The holding page's dev copy (#621 AC8): the production holding build,
      # crawlers blocked and every response noindex, at
      # dev-holding.yaweloidle.com through the front door
      # (#768, #1013), so Shyden checks it on his phones before a release. Before
      # the site Worker, whose HOLDING binding names it: the dev front door
      # shows it (#673).
      - name: Build the holding page, stamped with this commit
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build:holding --workspace @yawelo-idle/site
      - name: Make the holding page's dev copy (crawlers blocked, noindex)
        run: node scripts/holding-dev.ts
      # Named from the repository root: from its subfolder, npx runs wrangler
      # at apps/site, which reads the dev site's config instead (run
      # 38889757344 redeployed the dev site here).
      # Its door secret, uploaded with the version itself (#1078 AC3): the
      # Worker refuses any request its door did not send.
      - name: Write the holding page's dev copy's secrets file (the dev door secret)
        id: holding-secrets
        env:
          DEV_DOOR_SECRET: ${{ secrets.DEV_DOOR_SECRET }}
        run: |
          path="$(node scripts/holding-secrets.ts)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Deploy the holding page's dev copy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_FILE: ${{ steps.holding-secrets.outputs.path }}
        run: npx --no wrangler deploy --config apps/site/holding-dev/wrangler.jsonc --secrets-file "$SECRETS_FILE"
      - name: Build the site, stamped with this commit
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build --workspace @yawelo-idle/site
      # The site's secrets reach the Worker from the dev environment's
      # secrets, uploaded with the version itself, so no one types one into
      # Cloudflare (#357): the roadmap's webhook secret and App key (#341), and
      # the door secret (#784). The script puts the file in a new directory in the
      # system's temp, outside the checkout, and prints where (SonarCloud
      # S8707 on #943); bash's -e stops the step if the write fails.
      - name: Write the site's secrets file (the roadmap's webhook secret and App key, the dev door secret)
        id: site-secrets
        env:
          ROADMAP_WEBHOOK_SECRET: ${{ secrets.ROADMAP_WEBHOOK_SECRET }}
          ROADMAP_APP_KEY: ${{ secrets.ROADMAP_APP_KEY }}
          DEV_DOOR_SECRET: ${{ secrets.DEV_DOOR_SECRET }}
        run: |
          path="$(node scripts/dev-secrets.ts)"
          echo "path=$path" >> "$GITHUB_OUTPUT"
      - name: Deploy the site Worker with its secrets
        working-directory: apps/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.NONPROD_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.NONPROD_CLOUDFLARE_ACCOUNT_ID }}
          SECRETS_FILE: ${{ steps.site-secrets.outputs.path }}
        run: npx --no wrangler deploy --secrets-file "$SECRETS_FILE"
      # Last, so every deploy above has returned: a roadmap check that began
      # before this time may be the previous site Worker's, and verify-roadmap
      # waits past it (#708).
      - name: Note when the deploy finished
        id: deployed
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" >> "$GITHUB_OUTPUT"

  verify:
    needs: deploy
    runs-on: ubuntu-26.04
    # 8 s when the commit is already served; verify-dev waits at most 36 looks,
    # 5 s apart, for it to appear, then judges every check once (#83).
    timeout-minutes: 10
    environment:
      name: dev
      url: https://dev.yaweloidle.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Verify dev is password-gated, serves this commit, shows the holding page, and D1 answers
        env:
          # The origins' own addresses, never a door (#1078, #784 AC1b): once
          # the doors check the DEV pass, no CI request could pass them. The
          # door secret lets verify-dev stand in for the door, so the site
          # Worker shows its door's holding page (scripts/door-stand-in.ts).
          DEV_WEB_URL: https://yawelo-idle-site-dev.yawelo-idle-non-prod.workers.dev/
          DEV_SYNC_URL: https://yawelo-idle-sync-dev.yawelo-idle-non-prod.workers.dev
          DEV_DOOR_SECRET: ${{ secrets.DEV_DOOR_SECRET }}
          # The same address with no door: the site being built (#673).
          DEV_SITE_URL: https://yawelo-idle-site-dev.yawelo-idle-non-prod.workers.dev/
          # The game's own address, which must serve nothing (#332).
          DEV_GAME_URL: https://yawelo-idle-web-dev.yawelo-idle-non-prod.workers.dev/
          EXPECTED_SHA: ${{ github.sha }}
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: node scripts/verify-dev.ts
      # The front door in front of the real Workers, once verify-dev
      # has seen this commit served (#816): path, query, method and body
      # reach them unchanged (#1013).
      - name: Verify the dev hostnames reach the real Workers unchanged
        env:
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
          ROADMAP_WEBHOOK_SECRET: ${{ secrets.ROADMAP_WEBHOOK_SECRET }}
        run: node scripts/verify-dev-hosts.ts

  # The live roadmap's health, from the first check the deployed site Worker
  # made (#708). The site reads the board every 10 minutes, so this waits up
  # to 12 for a check after the deploy (Shyden, 2026-10-20: wait, no new
  # endpoint). Its own job, so the wait holds back neither verify nor smoke.
  verify-roadmap:
    needs: deploy
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    environment:
      name: dev
      url: https://dev.yaweloidle.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Verify the roadmap as the deployed code checked it (waits up to 12 minutes for its first check)
        timeout-minutes: 13
        env:
          DEV_WEB_URL: https://yawelo-idle-site-dev.yawelo-idle-non-prod.workers.dev/
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
          DEV_DOOR_SECRET: ${{ secrets.DEV_DOOR_SECRET }}
          DEPLOYED_AT: ${{ needs.deploy.outputs.deployed-at }}
        run: node scripts/verify-roadmap.ts

  # The game's browser smoke (tests/web), re-run against dev once verify has
  # seen this commit served there (#123 DoD). Same pinned image as CI's
  # browsers job: it carries Chromium, Firefox and WebKit, and Edge is
  # downloaded first, as root, since the image lacks it (#1003).
  smoke:
    needs: verify
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    # Firefox refuses to start as root in a home another user owns (PR
    # #1054): Playwright's own advice is HOME=/root.
    env:
      HOME: /root
    environment:
      name: dev
      url: https://dev.yaweloidle.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      # Root's git refuses a workspace the runner's user checked out ("not in
      # a git directory"), and npm ci's prepare runs git (PR #1054).
      - name: Mark the workspace safe for root's git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      # Playwright's image lacks Edge (Shyden, 2026-11-20, #1003). Downloaded
      # fresh every run: this job holds the dev password, so it restores
      # nothing from a cache (repo-template#224; tests/unit/edge-install-trusted.test.ts).
      # Downloaded fresh, so Microsoft's download speed sets its time: 16
      # passing installs in deploy-dev's 8 successful develop runs to
      # 2026-11-27 took 16–123 s (run 45779937070's site-smoke fetched 221 MB
      # at 2.2 MB/s), so 3 times the slowest is 369 s (#476, #1115 AC3). The
      # inner 370 s fires before the step's 7 minutes, so a stall names the
      # download it was on.
      - name: Install Edge (Playwright's image lacks it)
        timeout-minutes: 7
        shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=5 370 npx --no playwright install --with-deps msedge 2>&1 | tee "$RUNNER_TEMP/edge-install.log" || status=$?
          if [ "$status" = 124 ]; then
            echo "::error::Edge install stalled at 370 s; its last download was: $(grep -E '^Get:' "$RUNNER_TEMP/edge-install.log" | tail -n 1)"
          fi
          exit "$status"
      # The site's dev door checks a DEV pass (#1078 AC1): a machine pass from
      # the shared sign-in, asked with Yawelo's own Cloudflare Access service
      # token (yawelo-idle-ci). Masked at once, and handed to the suite only
      # through the job's environment file; the suite sends it as a
      # host-only cookie on the door (tests/dev-pass-cookie.ts).
      - name: Get a DEV pass for the site’s dev door
        timeout-minutes: 1
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          pass=$(node --input-type=module -e "
            const answer = await fetch('https://dev-signin.shyden.co.uk/machine?for=dev.yaweloidle.com', {
              method: 'POST',
              headers: {
                'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET,
              },
              signal: AbortSignal.timeout(30000),
            });
            if (!answer.ok) throw new Error('the sign-in answered ' + answer.status + ' to the machine pass request');
            process.stdout.write((await answer.json()).pass);
          ")
          echo "::add-mask::$pass"
          echo "DEV_PASS=$pass" >> "$GITHUB_ENV"
      - name: Smoke the game on dev (every supported target, behind the dev password)
        id: suite
        # A first limit since Edge joined (#1003), until its first runs are
        # measured (#476): then at least 3 times the slowest.
        timeout-minutes: 2
        env:
          WEB_SMOKE_URL: https://dev.yaweloidle.com/
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: npm run test:web:dev
      # Each failing test's screenshot and page snapshot (#888), only when
      # the suite itself failed: a step before it failing leaves nothing to
      # upload. No trace is kept (playwright.web.config.ts): it would carry
      # the dev password into this public artifact.
      - name: Upload the failing tests' screenshots and page snapshots
        if: ${{ failure() && steps.suite.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: smoke-failures
          path: test-results/
          retention-days: 14
          if-no-files-found: error

  # The site's browser suite (tests/site, #827): the roadmap page at the site
  # Worker's own address, where the site being built is seen (#673), read
  # from the real board. It waits for verify (this commit served) and
  # verify-roadmap (the snapshot read), so the page has a board to draw.
  site-smoke:
    needs: [verify, verify-roadmap]
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    container:
      image: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    # Firefox refuses to start as root in a home another user owns (PR
    # #1054): Playwright's own advice is HOME=/root.
    env:
      HOME: /root
    environment:
      name: dev
      url: https://yawelo-idle-site-dev.yawelo-idle-non-prod.workers.dev/roadmap
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      # Root's git refuses a workspace the runner's user checked out ("not in
      # a git directory"), and npm ci's prepare runs git (PR #1054).
      - name: Mark the workspace safe for root's git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      # Playwright's image lacks Edge (Shyden, 2026-11-20, #1003). Downloaded
      # fresh every run: this job holds the dev password, so it restores
      # nothing from a cache (repo-template#224; tests/unit/edge-install-trusted.test.ts).
      # Downloaded fresh, so Microsoft's download speed sets its time: 16
      # passing installs in deploy-dev's 8 successful develop runs to
      # 2026-11-27 took 16–123 s (run 45779937070's site-smoke fetched 221 MB
      # at 2.2 MB/s), so 3 times the slowest is 369 s (#476, #1115 AC3). The
      # inner 370 s fires before the step's 7 minutes, so a stall names the
      # download it was on.
      - name: Install Edge (Playwright's image lacks it)
        timeout-minutes: 7
        shell: bash
        run: |
          set -o pipefail
          status=0
          timeout --kill-after=5 370 npx --no playwright install --with-deps msedge 2>&1 | tee "$RUNNER_TEMP/edge-install.log" || status=$?
          if [ "$status" = 124 ]; then
            echo "::error::Edge install stalled at 370 s; its last download was: $(grep -E '^Get:' "$RUNNER_TEMP/edge-install.log" | tail -n 1)"
          fi
          exit "$status"
      # The site's dev door checks a DEV pass (#1078 AC1): a machine pass from
      # the shared sign-in, asked with Yawelo's own Cloudflare Access service
      # token (yawelo-idle-ci). Masked at once, and handed to the suite only
      # through the job's environment file; the suite sends it as a
      # host-only cookie on the door (tests/dev-pass-cookie.ts).
      - name: Get a DEV pass for the site’s dev door
        timeout-minutes: 1
        shell: bash
        env:
          CF_ACCESS_CLIENT_ID: ${{ secrets.CF_ACCESS_CLIENT_ID }}
          CF_ACCESS_CLIENT_SECRET: ${{ secrets.CF_ACCESS_CLIENT_SECRET }}
        run: |
          pass=$(node --input-type=module -e "
            const answer = await fetch('https://dev-signin.shyden.co.uk/machine?for=dev.yaweloidle.com', {
              method: 'POST',
              headers: {
                'CF-Access-Client-Id': process.env.CF_ACCESS_CLIENT_ID,
                'CF-Access-Client-Secret': process.env.CF_ACCESS_CLIENT_SECRET,
              },
              signal: AbortSignal.timeout(30000),
            });
            if (!answer.ok) throw new Error('the sign-in answered ' + answer.status + ' to the machine pass request');
            process.stdout.write((await answer.json()).pass);
          ")
          echo "::add-mask::$pass"
          echo "DEV_PASS=$pass" >> "$GITHUB_ENV"
      - name: Drive the roadmap page on dev (every supported target, behind the dev password)
        id: suite
        # A first limit, until its first run is measured (#476): then at
        # least 3 times its slowest run.
        timeout-minutes: 3
        env:
          SITE_SMOKE_URL: https://yawelo-idle-site-dev.yawelo-idle-non-prod.workers.dev/
          DEV_BASIC_AUTH_PASSWORD: ${{ secrets.DEV_BASIC_AUTH_PASSWORD }}
        run: npm run test:site:dev
      # Each failing test's screenshot and page snapshot (#864), only when
      # the suite itself failed: a step before it failing leaves nothing to
      # upload. No trace is kept (tests/site/smoke-config.ts): it would
      # carry the dev password into this public artifact.
      - name: Upload the failing tests' screenshots and page snapshots
        if: ${{ failure() && steps.suite.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-smoke-failures
          path: test-results/
          retention-days: 14
          if-no-files-found: error

  # The holding page's dev copy (#621 AC8), checked from outside against
  # what this commit builds: noindex on every response, crawlers blocked. It
  # reads the copy at its own workers.dev address, standing in for its door
  # with the door secret (#1078), so it runs in the dev environment.
  verify-holding:
    needs: deploy
    runs-on: ubuntu-26.04
    # verify-prod waits at most 60 looks, 10 s apart, then judges once.
    timeout-minutes: 15
    # The dev environment holds DEV_DOOR_SECRET, the door's stand-in (#1078).
    environment:
      name: dev
      url: https://dev.yaweloidle.com
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (docker/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' docker/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          # No cache: this job holds the door secret (#1120).
      - run: npm ci
      - name: Build the holding page this commit deployed
        env:
          YAWELO_IDLE_COMMIT: ${{ github.sha }}
        run: npm run build:holding --workspace @yawelo-idle/site
      - name: Make its dev copy (crawlers blocked, noindex)
        run: node scripts/holding-dev.ts
      - name: Verify the holding page's dev copy serves this commit, noindex, crawlers blocked
        env:
          DEV_HOLDING_URL: https://yawelo-idle-holding-dev.yawelo-idle-non-prod.workers.dev
          DEV_DOOR_SECRET: ${{ secrets.DEV_DOOR_SECRET }}
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/verify-prod.ts --dev-copy

  # dev-verified means every check above passed: verify-dev, then the smoke,
  # the holding page's dev copy (#621), and the roadmap (#708).
  dev-verified:
    needs: [smoke, site-smoke, verify-holding, verify-roadmap]
    runs-on: ubuntu-26.04
    timeout-minutes: 2
    permissions:
      statuses: write
    steps:
      - name: Post dev-verified on the deployed commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}"
          -f state=success -f context=dev-verified
          -f description="Live on dev: password-gated, this commit, game behind the site, D1 answers, smoke clean, holding copy noindex, roadmap fresh"
          -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
