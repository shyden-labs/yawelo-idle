# The SonarCloud quality gate, blocking (#655, from shyden-labs/repo-template#27;
# Shyden's ruling of 2026-10-18: a scan that does not run fails, and the results
# are checked, failing the workflow when the gate fails; every project adopts
# it, blocking).
#
# Its own pull-request workflow (Shyden, 2026-11-08): it measures coverage
# itself, so the deploys that call ci.yml are untouched and no job-level
# condition can skip the check (#782). It fails when the token is missing,
# measures every suite pull-request CI runs, scans, then reads the gate of THAT
# scan's analysis and is green only on OK. A docs-only change measures nothing
# (#360), so it scans without a report; the scan and its verdict still run.
# Nothing swallows a failure (tests/unit/workflow-honesty.test.ts). Settings:
# sonar-project.properties.
#
# The token lives in the `sonarcloud` environment (spec §12.9: secrets live in
# environments). Dependabot's runs get no environment secrets, so theirs read
# the repository's Dependabot secret of the same name.
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: sonarcloud
on:
  pull_request:

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-26.04
    timeout-minutes: 25
    # The image the coverage job in ci.yml measures in, so the suites run alike.
    container:
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --user 1001
    environment: sonarcloud
    steps:
      - name: The SonarCloud token is set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SONAR_TOKEN is missing::Set SONAR_TOKEN as an Actions secret, and as a Dependabot secret for Dependabot pull requests (#655)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (.github/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          cache: 'npm'
      - name: Classify the change as docs-only or full (#360)
        id: classify
        env:
          EVENT: ${{ github.event_name }}
        run: node scripts/ci-scope.ts
      - name: Install (a warning fails it)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        run: scripts/fail-on-warnings.sh npm ci
      - name: Measure coverage (every suite pull-request CI runs)
        if: ${{ steps.classify.outputs.scope != 'docs-only' }}
        timeout-minutes: 12
        run: npm run test:coverage
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=shyden-labs
            -Dsonar.projectKey=shyden-labs_yawelo-idle
      - name: Read the quality gate of this scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/sonar-verdict.ts .scannerwork/report-task.txt
