# The SonarCloud quality gate, blocking (#655, from shyden-labs/repo-template#27;
# Shyden's ruling of 2026-10-18: a scan that does not run fails, and the results
# are checked, failing the workflow when the gate fails; every project adopts
# it, blocking).
#
# Called by ci.yml after its coverage job. It fails when the token is missing,
# scans with the coverage report that job uploaded in this run (no second run
# of the suites), then reads the gate of THAT scan's analysis and is green only
# on OK. A docs-only change measures nothing, so it scans without a report; the
# scan and its verdict still run. Nothing swallows a failure
# (tests/unit/workflow-honesty.test.ts). Settings: sonar-project.properties.
#
# Every third-party `uses:` is a full commit SHA with its `# vX.Y.Z` comment.
name: sonarcloud
on:
  workflow_call:
    inputs:
      organization:
        required: true
        type: string
      project-key:
        required: true
        type: string
      coverage:
        description: Whether the coverage job measured and uploaded a report.
        required: true
        type: boolean
    secrets:
      SONAR_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  sonarcloud:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - name: The SonarCloud token is set
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "$SONAR_TOKEN" ]; then
            echo "::error title=SONAR_TOKEN is missing::Set SONAR_TOKEN as an Actions secret, and as a Dependabot secret for Dependabot pull requests (#655)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The exact Node, from the one file Dependabot bumps (#793, shyden-labs/repo-template#143).
      - name: Read the exact Node version (.github/node/Dockerfile)
        id: node
        run: |
          version=$(sed -nE 's/^FROM node:([0-9]+\.[0-9]+\.[0-9]+)$/\1/p' .github/node/Dockerfile)
          test -n "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ steps.node.outputs.version }}
      - name: Fetch the coverage report this run measured
        if: ${{ inputs.coverage }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
          path: coverage/
      - name: Scan
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ inputs.organization }}
            -Dsonar.projectKey=${{ inputs.project-key }}
      - name: Read the quality gate of this scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: node scripts/sonar-verdict.ts .scannerwork/report-task.txt
