# Every third-party `uses:` is a full 40-hex commit SHA with a trailing
# `# vX.Y.Z` comment, as in ci.yml (tests/unit/supply-chain.test.ts).
#
# Samples the properties suite's reach counts for their measured minimums
# (#84; Shyden, 2026-10-12: "Fresh cases, safe minimums") on a commit not
# yet pushed to its branch (#718; global rule 2026-10-21: "a CI bot never
# pushes to a branch"). The session pushes the commit to the scratch ref
# `refs/minimums/<branch>`, which starts no run, and dispatches this
# workflow on develop with the branch and the SHA (#718 AC1, run
# 39521577298). This runs the whole properties suite 200 times at that SHA,
# 50 runs on each of 4 shards, every run a fresh process drawing fresh seeds
# and recording every reach count, and uploads each shard's runs as
# `minimums-<sha>-<shard>`. `npm run minimums:fetch <run-id>` reads them
# back, writes the minimums into the unpushed commit, and the branch is
# pushed once. A red run is a real defect, never a re-run (AC9). The
# workflow file is develop's copy; the scripts it runs are the sampled
# commit's. Nothing here can write to the repository.
name: record-minimums
run-name: record-minimums ${{ inputs.branch }} at ${{ inputs.sha }}
on:
  workflow_dispatch:
    inputs:
      branch:
        description: The ticket branch whose scratch ref holds the commit
        required: true
        type: string
      sha:
        description: The full SHA at refs/minimums/<branch>
        required: true
        type: string

permissions:
  contents: read

jobs:
  record-minimums:
    runs-on: ubuntu-24.04
    # 50 runs of the properties suite, measured at 8.2 s wall in CI on
    # 2026-10-15 (run 38777273204), plus each run's start-up: about 9 min.
    # Re-measured from the first record and set from it (#84 spec §6).
    timeout-minutes: 20
    strategy:
      # One red shard leaves the record unusable: stop the others.
      fail-fast: true
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      # develop and main are never sampled into: their minimums come from the
      # ticket branches merged into them. The inputs reach the shell only
      # through env, and only in the shapes checked here. The SHA alone could
      # name any commit: only the one the session pushed to the branch's
      # scratch ref is sampled, read from the public repository before
      # anything is checked out (a failed read leaves the tip empty: refused).
      - name: Refuse anything but the tip of a ticket branch's scratch ref
        env:
          BRANCH: ${{ inputs.branch }}
          SHA: ${{ inputs.sha }}
          REFUSED: develop main
          REPOSITORY: ${{ github.server_url }}/${{ github.repository }}
        run: |
          for branch in $REFUSED; do
            if [ "$BRANCH" = "$branch" ]; then
              echo "::error::record-minimums samples ticket branches, not $BRANCH (#84)."
              exit 1
            fi
          done
          if ! printf '%s' "$BRANCH" | grep -Eqx '[A-Za-z0-9._/-]+'; then
            echo "::error::branch must be a branch name (#718)."
            exit 1
          fi
          if ! printf '%s' "$SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::sha must be 40 lowercase hex characters (#718)."
            exit 1
          fi
          tip="$(git ls-remote "$REPOSITORY" "refs/minimums/$BRANCH" | cut -f1)"
          if ! [ "$tip" = "$SHA" ]; then
            echo "::error::refs/minimums/$BRANCH is at '${tip}', not $SHA (#718)."
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install (a warning fails it)
        run: scripts/fail-on-warnings.sh npm ci
      - name: Sample the minimums
        env:
          MINIMUMS_RECORD_JOB: record-minimums
        run: npm run minimums:sample -- --runs 50 --out minimums-runs
      - name: Upload the sampled runs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: minimums-${{ inputs.sha }}-${{ matrix.shard }}
          path: minimums-runs/
          if-no-files-found: error
